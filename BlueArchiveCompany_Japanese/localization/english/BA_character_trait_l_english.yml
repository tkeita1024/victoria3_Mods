l_english:
 #traits
 BA_Yuuka_ID: "Yuuka's student ID card"
 BA_Yuuka_ID_desc: "The treasurer of Seminar, the student council of Millennium Science School.\NYuuka has a mathematical acumen that is notable even among Millennium's high ratio of STEM students. She oversees the entirety of Millennium's budget. Her special talent is the abacus, and she has a habit of fiddling with the beads when dealing with emotional or mental conflicts." 
 BA_Momoi_ID: "Momoi's student ID card"
 BA_Momoi_ID_desc: "Scenario writer of the Game Development Department at the Millennium School.\NBoth Momoi and her twin sister, Midori, develop games with the Game Development Department. Though her lighthearted and cheerful personality previously put her at odds with her more introverted little sister, the two are now inseparable thanks to their shared love of video games." 
 BA_Hina_ID: "Hina's student ID card"
 BA_Hina_ID_desc: "Head prefect of the Gehenna Academy Prefect Team.\NSomewhat aloof and considers almost everything a bother and a chore, but is still every bit the head prefect of the Prefect Team when it comes to rules and regulations."
 BA_Mari_ID: "Mari's student ID card"
 BA_Mari_ID_desc: "A sincere and benevolent girl affiliated with the Sisterhood.\nShe always greets Trinity students with a friendly smile. Despite her cuteness, many come to her for counseling because of the calm and relaxing air about her. She is self-critical and always considers herself as lacking, but she dreams of becoming a great Sister like her upperclassmen."
 BA_Hikari_ID: "Hikari's student ID card"
 BA_Hikari_ID_desc: "An officer of Highlander Railroad Academy's Central Control Center.\NShe and her twin sister, Nozomi, were selected for their genius talent in locomotive driving skills, but she's a total flop when it comes to paperwork or administrative work. Her tendency to follow her desires and do things at her own pace, with little regard for others' opinions, causes all sorts of trouble."
 BA_Miyako_ID: "Miyako's student ID card"
 BA_Miyako_ID_desc: "The leader of the RABBIT Squad at SRT Academy. Her call sign is “RABBIT 1”.\NMiyako originally registered for SRT Academy because of her deep admiration for its adherence to justice. When they suddenly closed down the academy, she was left homeless and camping out in a park with other RABBIT Squad members. She is to-the-point and rarely shows what she's thinking so can come off as uncaring, but has the kindest heart in the squad."
 BA_Mimori_ID: "Mimori's student ID card"
 BA_Mimori_ID_desc: "Hyakkiyako Academy Inner Discipline Club's kind vice president.\NA popular girl because she always has a gentle smile and is kind to everyone. The childhood friend of Tsubaki, the president of the Inner Discipline Club. She joined the club to fulfill her dream of becoming an elegant lady like the ones in the shoujo manga she used to read when she was young. She continues to train diligently by cooking and cleaning to make her dream come true."
 BA_Hare_ID: "Hare's student ID card"
 BA_Hare_ID_desc: "An engineer of Veritas, the hacker group of Millennium Science School.\NAn unprecedented genius even amongst the brilliant minds at Millennium. Most of the school's cutting-edge technology was developed by her. Even with all these achievements, she remains humble, friendly, and considerate towards her peers."
 BA_Fuuka_ID: "Fuuka's student ID card"
 BA_Fuuka_ID_desc: "A member of the School Lunch Club that manages Gehenna Academy's dining hall.\NA kind and earnest student, making her a bit of a rarity at Gehenna. She prepares and serves hundreds of meals every morning for the students of Gehenna. She's a good cook, but her skills are written off due to the dining hall's lack of manpower. Still, she refuses to give up and is constantly looking for ways to improve the menu."
 BA_Nagisa_ID: "Nagisa's student ID card"
 BA_Nagisa_ID_desc: "The leader of Filius, one of the allied factions that makes up Trinity General School, and the host of the Tea Party.\NAlthough she has a sweet and friendly demeanor, she rarely reveals her true feelings, so she's not very approachable. Her hobby is preparing tea and refreshments for tea parties. Many Trinity students long to attend her get-togethers.”"
 BA_Hifumi_ID: "Hifumi's student ID card"
 BA_Hifumi_ID_desc: "A friendly, outgoing member of the Trinity Make-Up Work Club.\NHifumi's just a regular girl with average grades, but she's nonetheless well liked and popular for her well-rounded personality. She's a good listener for anyone who needs to vent about their worries or problems, but this also causes her to get swept up in the moment and unintentionally cause trouble."
 BA_Wakamo_ID: "Wakamo's student ID card"
 BA_Wakamo_ID_desc: "One of the Seven Prisoners that escaped the Corrections Bureau after being suspended from Allied Hyakkiyako Academy.\NShe is the feared Fox of Calamity due to her destructive ways. Her motives are a mystery, and there are several rumors surrounding the face under her mask. Some say there's a monstrous devil underneath, but it remains only a rumor."
 BA_Hoshino_ID: "Hoshino's student ID card"
 BA_Hoshino_ID_desc: "The Abydos Student Council vice president and president of the Foreclosure Task Force.\NActs more like a tired old timer and would rather play pranks than do actual work. This often gets her into trouble with her fellow task force members, but once on a mission, she fights harder on the front lines than anyone else to keep her friends safe."
 BA_Kisaki_ID: "Kisaki's student ID card"
 BA_Kisaki_ID_desc: "The president of Genryumon, the student council that oversees everything that happens in Shanhaijing Academy.\NShe gives off an atmosphere that makes her difficult to approach with her elegant yet intimidating style of talking mixed in with her mysterious impression. However, it seems that she actually utilizes that impression of her to help with her duties. Her “disguised undercover travel”, which rarely gets noticed by most people, can be quite a scene for those who are aware."
 BA_Aru_ID: "Aru's student ID card"
 BA_Aru_ID_desc: "The self-proclaimed boss of Problem Solver 68.\NAru expanded Gehenna Academy's Problem Solver 68 club without permission to conduct illegal business activities. She aspires to be seen as a dashing and debonair villain, but her frequent blunders always expose her as a poser."
 BA_Iroha_ID: "Iroha's student ID card"
 BA_Iroha_ID_desc: "A member of the Pandemonium Society.\nThere's nothing Iroha hates more than being bothered. She spends much of her time trying to figure out how to escape company. She even constantly carries a book around so people will leave her alone, but the Pandemonium Society (Makoto, to be exact) always interrupts her anyway. She begrudgingly serves as an executive of the Pandemonium Society, only finding comfort in their mascot, Ibuki."
 BA_Serina_ID: "Serina's student ID card"
 BA_Serina_ID_desc: "A kind-hearted girl affiliated with the Trinity Remedial Knights.\NA virtuous person who enjoys charity work, her concern for the health of those around her has earned her a reputation as a sort of mother hen. Despite having a somewhat timid personality and avoiding quarrels and conflict, she is always ready to stand up against enemies who threaten the peace."
