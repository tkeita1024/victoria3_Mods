 BA_Arisu_ID: "Arisu's student ID card"
 BA_Arisu_ID_desc: "A member of the Game Development Department at the Millennium School.\NA mysterious girl who was found sleeping within some ruins. All information regarding Aris' age and origins is unknown. Currently, she has become a hardcore video game fanatic thanks to Midori and Momoi. The majority of her inarticulate speech is comprised of dialog from retro video games."
 BA_Yuzu_ID: "Yuzu's student ID card"
 BA_Yuzu_ID_desc: "President of Millennium's Game Development Department.\NYuzu struggles with social anxiety and finds it difficult to deal with people, so she spends most of her time in a cabinet in the Game Development Department. Despite that, her passion for games is second to none. She loves both making and playing games."
 BA_Midori_ID: "Midori's student ID card"
 BA_Midori_ID_desc: "Illustrator of the Game Development Department at the Millennium School.\NBoth Midori and her twin sister, Momoi, develop games with the Game Development Department.\NThough her introverted personality had previously put her at odds with her more gregarious older sister, the two are now inseparable thanks to their shared love of video games."
 BA_Azusa_ID: "Azusa's student ID card"
 BA_Azusa_ID_desc: "The ice queen of Trinity's Make-Up Work Club.\NAfter dropping out of school, she ended up at Trinity and is studying again. Despite being lonely, Azusa distances herself from others to avoid causing trouble—a source of concern for the other Make-Up Work Club members."
 BA_Koharu_ID: "Koharu's student ID card"
 BA_Koharu_ID_desc: "A member of Trinity's Make-Up Work Club.\NKoharu was originally part of the Justice Task Force, but she was forced to transfer to the Make-Up Work Club due to poor grades which put her at risk of flunking. A dunce who can't keep up with her classes despite thinking she's an elite student. Koharu reads racy material for fun, and gets dirty ideas from the most trivial things, which ends with her embarrassing herself."
 BA_Hanako_ID: "Hanako's student ID card"
 BA_Hanako_ID_desc: "A friendly girl from the Make-Up Work Club.\NShe may appear like a quiet and elegant young lady at first, but a bevy of inappropriate and lewd comments spew out any time Hanako opens her mouth. Every member of the Make-Up Work Club gets nervous whenever Hanako starts speaking."
 BA_Noa_ID: "Noa's student ID card"
 BA_Noa_ID_desc: "Secretary for the Millennium School Student Council, Seminar.\NHer main responsibility is to maintain Seminar's official records, but she also handles various other legal and administrative duties, such as overseeing patent applications and product evaluations for Millennium student creations. Her extraordinary memory allows her to almost perfectly remember anything she's read or heard once."
 BA_Koyuki_ID: "Koyuki's student ID card"
 BA_Koyuki_ID_desc: "A brilliant yet troublesome member of Millennium's Seminar.\NShe's completely unaware of her unrivaled talent for mathematical decryption. She always sets out to test her luck. Even if she goes too far and lands in hot water, she never stops."
 BA_Rio_ID: "Rio's student ID card"
 BA_Rio_ID_desc: "President of Seminar, the student council of Millennium School.\NHer desires for peace, in Millennium and the world, drive her to do whatever she thinks is necessary. As a result, she became known as everyone's “big sister”. Her stylistic and aesthetic tastes are quite unique. Her Avant Guard robot corps, which is known only to a few students, exemplifies those tastes."
 BA_Seia_ID: "Seia's student ID card"
 BA_Seia_ID_desc: "A member of the Tea Party, from Trinity General School, and leader of Sanctus.\NOthers find her pedantic and unpredictable. A bit capricious and impulsive, rather like a noble. Following her recovery from an assassination attempt, she's shown more of her stubborn and childish side."
 BA_Mika_ID: "Mika's student ID card"
 BA_Mika_ID_desc: "The former leader of Pater, one of the allied factions that makes up Trinity General School.\NA former Tea Party member and a childhood friend of Nagisa, another member of the Tea Party. When the two clash politically, she draws a clear line between their public disagreements and their private friendship.\NShe seems lively and cheerful, and she's never without a smile. However, her demeanor hides worries that she can't reveal, making her something of an enigma."
 BA_Serika_ID: "Serika's student ID card"
 BA_Serika_ID_desc: "The conscientious treasurer of the Abydos Foreclosure Task Force.\NSerika nags a lot and does not hesitate to let her opinions be known. Despite her habit of bashing the academy, saying, “To hell with this academy!” she is secretly quite devoted to it and even works part-time jobs to try and help pay off the academy's debts."
 BA_Shiroko_ID: "Shiroko's student ID card"
 BA_Shiroko_ID_desc: "The sporty field captain of the Abydos Foreclosure Task Force.\NA girl of few words and almost no facial expression, Shiroko gives the impression of being frigid and emotionless. In truth, she is more devoted to Abydos High School than anything else. If it's for the sake of revitalizing the academy, she'll do whatever it takes and sometimes propose some outlandish ideas herself."
 BA_Nonomi_ID: "Nonomi's student ID card"
 BA_Nonomi_ID_desc: "A member of the Abydos Foreclosure Task Force.\NA friendly, pleasant girl that provides the Foreclosure Task Force with much-needed emotional support to balance out the extreme personalities of its other members. Though she doesn't show it, she comes from a wealthy family and pays for nearly all of the Foreclosure Task Force's snacks out of her own pocket."
 BA_Ayane_ID: "Ayane's student ID card"
 BA_Ayane_ID_desc: "The diligent secretary of the Abydos Foreclosure Task Force.\NA hard-working stickler for rules and regulations, she does her best to contribute to the revitalization of Abydos High School."
 BA_Saki_ID: "Saki's student ID card"
 BA_Saki_ID_desc: "The point woman of SRT Academy RABBIT Squad. Call sign is “RABBIT 2”.\NSaki enrolled in SRT Academy to live the life of discipline she'd always dreamed of. When the academy closed down, she, along with her squad, refused to give up on their school and began camping out in the park in protest. A star student, she still carries around her textbooks and SRT manuals to this day. She enjoys foraging for wild greens and trash that can be repurposed as supplies."
 BA_Miyu_ID: "Miyu's student ID card"
 BA_Miyu_ID_desc: "The sniper of SRT Academy's RABBIT Squad. Her call sign is “RABBIT 4”.Miyu entered SRT due to her natural sniping talent, but struggled with her meek and shy temperament. Just as she found a home in the academy, it closed down and she joined the rest of her squad camping out in the park. Her lack of presence makes her a great sniper, but sometimes even her allies forget she exists."
 BA_Moe_ID: "Moe's student ID card"
 BA_Moe_ID_desc: "The operator of the SRT Academy RABBIT Squad. Call sign is RABBIT 3.She entered SRT Academy because she admired their massive firepower, but the academy was suddenly closed. She's currently living in a park with her platoon members. She's bizarre in that she enjoys blowing up and destroying things, but her ability as an operator is quite impressive. She's addicted to sugar and always has a lollipop in her mouth."
