#create ceo events
 ba_create_company_ceo_events.1.t: "Yuuka from the Seminar"
 ba_create_company_ceo_events.1.d: "Sensei. I'll do everything I can to assist you today as well."
 ba_create_company_ceo_events.1.f: "The conditions have been met. You could call it destiny. Let's get down to business."
 ba_create_company_ceo_events.2.t: "Momoi from the Game Development Department"
 ba_create_company_ceo_events.2.d: "Games! Games! I just want to play games!"
 ba_create_company_ceo_events.2.f: "Wanna hear a fun story? Let me tell you!"
 ba_create_company_ceo_events.3.t: "Miyako from the RABBIT Squad"
 ba_create_company_ceo_events.3.d: "RABBIT Squad is ready to mobilize at any time."
 ba_create_company_ceo_events.3.f: "SRT Academy, RABBIT Squad's Tsukiyuki Miyako. Your orders, Sensei."
 ba_create_company_ceo_events.4.t: "Hoshino from the Foreclosure Task Force"
 ba_create_company_ceo_events.4.d: "Welcome, Sensei. I see that you're still working as hard as ever."
 ba_create_company_ceo_events.4.f: "*yawn* Let's take it slow and steady. No point in wearing ourselves out."
 ba_create_company_ceo_events.5.t: "Nagisa from the Tea Party"
 ba_create_company_ceo_events.5.d: "Welcome, Sensei. If you'd like, how about a cup of black tea before work?"
 ba_create_company_ceo_events.5.f: "How are you? I'm Kirifuji Nagisa, host of the Tea Party at Trinity General School. I'll do my best to assist you."
 ba_create_company_ceo_events.6.t: "Hifumi from the Make-Up Work Club"
 ba_create_company_ceo_events.6.d: "Peroro merch..."
 ba_create_company_ceo_events.6.f: "Ahaha... I'm still new to this kind of thing, so please be patient with me."
#create general events
 ba_create_company_events.1.t: "Arisu from the Game Development Department "
 ba_create_company_events.1.d: "“Bangbang Kabang”"
 ba_create_company_events.1.f: "Go with the light at your back, hero."
 ba_create_company_events.2.t: "Yuzu from the Game Development Department"
 ba_create_company_events.2.d: "P-Please don't come looking for me..."
 ba_create_company_events.2.f: "I'm Yuzu, president of the Game Development Department. You're really going to accept me?"
 ba_create_company_events.3.t: "Midori from the Game Development Department "
 ba_create_company_events.3.d: "I'm very proud of how this illustration turned out!"
 ba_create_company_events.3.f: "I'm the best player around! I'll help you out."
 ba_create_company_events.4.t: "Azusa from the Make-Up Work Club"
 ba_create_company_events.4.d: "If life has no intrinsic meaning, then why do we live at all?"
 ba_create_company_events.4.f: "I'm Shirasu Azusa, a transfer to Trinity. I work solo and can take cover easily due to my size. Any other questions?"
 ba_create_company_events.5.t: "Koharu from the Make-Up Work Club"
 ba_create_company_events.5.d: "Burn all the dirty stuff! Burn it!"
 ba_create_company_events.5.f: "Shimoe Koharu... Mark my words. I won't be here for long!"
 ba_create_company_events.6.t: "Hanako from the Make-Up Work Club"
 ba_create_company_events.6.d: "Huh? What do I mean? I'm not sure... What DO I mean?"
 ba_create_company_events.6.f: "I'm Urawa Hanako. I look forward to working with you, in all kinds of ways."
 ba_create_company_events.7.t: "Noa from the Seminar"
 ba_create_company_events.7.d: "Will you come away with me to the realm of reason?"
 ba_create_company_events.7.f: "I am Ushio Noa, Seminar's secretary. I look forward to your support, Sensei."
 ba_create_company_events.8.t: "Koyuki from the Seminar"
 ba_create_company_events.8.d: "When the plan falls apart, well... That's when life gets interesting!"
 ba_create_company_events.8.f: "Is there anything fun going on? I, Kurosaki Koyuki, am here! Yahahaha!"
 ba_create_company_events.9.t: "Rio from the Seminar"
 ba_create_company_events.9.d: "We'll meet again in a place where light doesn't shine."
 ba_create_company_events.9.f: "Tsukatsuki Rio, from Millennium Science School's Seminar. I'll provide you with the most rational approach to every issue."
 ba_create_company_events.10.t: "Seria from the Tea Party"
 ba_create_company_events.10.d: "Like this, all roads connect to one"
 ba_create_company_events.10.f: "It's been a while. I've been waiting for you, Sensei."
 ba_create_company_events.11.t: "Mika from the Tea Party"
 ba_create_company_events.11.d: "Thanks for waiting! It's my turn to jump in! ☆"
 ba_create_company_events.11.f: "Don't worry, I, Misono Mika, have finally arrived! Oh, we're already well acquainted, so let's skip the formalities, okay? I'm looking forward to working with you, Sensei."
 ba_create_company_events.12.t: "Shiroko from the Foreclosure Task Force"
 ba_create_company_events.12.d: "Do you need my help?"
 ba_create_company_events.12.f: "Second-year of Abydos' Foreclosure Task Force, Sunaookami Shiroko. Hello."
 ba_create_company_events.13.t: "Serika from the Foreclosure Task Force"
 ba_create_company_events.13.d: "Do I need to head to my part-time job already? ...No, not yet."
 ba_create_company_events.13.f: "I'm Kuromi Serika, and there will be no slacking on my watch. Understood?"
 ba_create_company_events.14.t: "Nonomi from the Foreclosure Task Force"
 ba_create_company_events.14.d: "Finally, it's time for me to make my move!"
 ba_create_company_events.14.f: "Yup yup, I'm finally here! I look forward to working with you, Sensei!"
 ba_create_company_events.15.t: "Ayane from the Foreclosure Task Force"
 ba_create_company_events.15.d: "How does it work?"
 ba_create_company_events.15.f: "I'm Okusora Ayane. You can count on my support."
 ba_create_company_events.16.t: "Saki from the RABBIT Squad"
 ba_create_company_events.16.d: "Call sign, RABBIT 2. Sensitivity is good."
 ba_create_company_events.16.f: "SRT Academy, RABBIT Squad's Sorai Saki. So, where's the Schale operation manual?"
 ba_create_company_events.17.t: "Miyu from the RABBIT Squad"
 ba_create_company_events.17.d: "Th-This is RABBIT 4. D-Did you call...?"
 ba_create_company_events.17.f: "Th-This is SRT Academy. RABBIT Squad's Kasumizawa Miyu... Umm... May I please...go b-back...?"
 ba_create_company_events.18.t: "Moe from the RABBIT Squad"
 ba_create_company_events.18.d: "This is RABBIT 3. Where's the next bombing site?"
 ba_create_company_events.18.f: "SRT Academy, RABBIT Squad's Kazekura Moe. Heeheehee... I'll be your support."
 