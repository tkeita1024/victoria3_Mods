l_japanese:
#normal option loc
 ba_create_company_events_option_general: "将軍になる"
 ba_create_company_events_option_admiral: "提督になる"
 ba_create_company_events_option_agitator: "扇動家になる"
#opening option
 ba_create_company_events.0.t: "ブルーアーカイブMODのゲームモード選択"
 ba_create_company_events.0.d: "先生、選択をお願いします。"
 ba_create_company_events.0.f: "第一の選択肢は完全版です。第二の選択肢はマイナス版で、キャラクターのみを保持します。"
 ba_create_company_events.0.a: "完全版"
 ba_create_company_events.0.b: "マイナス版"
#create ceo events
 ba_create_company_ceo_events.1.t: "セミナーの優香"
 ba_create_company_ceo_events.1.d: "先生。今日も全力でサポートさせていただきます。"
 ba_create_company_ceo_events.1.f: "条件は整いました。これを運命と呼んでもいいでしょう。さあ、仕事に取り掛かりましょう。"
 ba_create_company_ceo_events.2.t: "ゲーム開発部のモモイ"
 ba_create_company_ceo_events.2.d: "ゲーム！ゲーム！ゲームがしたい！"
 ba_create_company_ceo_events.2.f: "面白い話聞きたい？教えてあげる！"
 ba_create_company_ceo_events.3.t: "RABBIT小隊のミヤコ"
 ba_create_company_ceo_events.3.d: "RABBIT小隊はいつでも出動可能です。"
 ba_create_company_ceo_events.3.f: "SRT学園、RABBIT小隊の月雪ミヤコです。ご指示をお願いします、先生。"
 ba_create_company_ceo_events.4.t: "対策委員会のホシノ"
 ba_create_company_ceo_events.4.d: "いらっしゃい、先生。相変わらずお疲れ様です。"
 ba_create_company_ceo_events.4.f: "*あくび* ゆっくりと着実に進めましょう。無理して疲れても仕方ないですから。"
 ba_create_company_ceo_events.5.t: "ティーパーティーのナギサ"
 ba_create_company_ceo_events.5.d: "いらっしゃいませ、先生。よろしければ、お仕事の前に紅茶でもいかがですか？"
 ba_create_company_ceo_events.5.f: "ご機嫌いかがですか？私はトリニティ総合学園、ティーパーティーの主催者、桐藤ナギサです。精一杯サポートさせていただきます。"
 ba_create_company_ceo_events.6.t: "補習授業部のヒフミ"
 ba_create_company_ceo_events.6.d: "ペロログッズ…"
 ba_create_company_ceo_events.6.f: "あはは…まだまだ不慣れなことばかりで、ご迷惑をおかけするかもしれませんが、よろしくお願いします。"
#create general events
 ba_create_company_events.1.t: "ゲーム開発部のアリス"
 ba_create_company_events.1.d: "「バンバンカバン」"
 ba_create_company_events.1.f: "光を背に、勇者よ進め。"
 ba_create_company_events.2.t: "ゲーム開発部のユズ"
 ba_create_company_events.2.d: "き、きてないでください…"
 ba_create_company_events.2.f: "ゲーム開発部、部長の花岡ユズです。本当に私を受け入れてくれるんですか？"
 ba_create_company_events.3.t: "ゲーム開発部のミドリ"
 ba_create_company_events.3.d: "今回のイラストは自信作です！"
 ba_create_company_events.3.f: "最高のゲームで先生をサポートします！"
 ba_create_company_events.4.t: "補習授業部のアズサ"
 ba_create_company_events.4.d: "人生に意味がないなら、なぜ私たちは生きているのでしょうか？"
 ba_create_company_events.4.f: "白洲アズサです。最近トリニティに転校してきました。単独行動が得意で、小柄なので隠れやすいのが長所です。他に質問はありますか？"
 ba_create_company_events.5.t: "補習授業部のコハル"
 ba_create_company_events.5.d: "汚いものは全部燃やせ！燃やせ！"
 ba_create_company_events.5.f: "下江コハルです…。言っておきますが、私は長くここにいるつもりはありません！"
 ba_create_company_events.6.t: "補習授業部のハナコ"
 ba_create_company_events.6.d: "え？何って？よくわからない…何って言ってるの？"
 ba_create_company_events.6.f: "浦和ハナコです。いろんな意味で、よろしくお願いします。"
 ba_create_company_events.7.t: "セミナーのノア"
 ba_create_company_events.7.d: "私と共に理性の世界へ来ませんか？"
 ba_create_company_events.7.f: "セミナーの書記、生塩ノアです。よろしくお願いします、先生。"
 ba_create_company_events.8.t: "セミナーのコユキ"
 ba_create_company_events.8.d: "計画が崩れた時こそ、人生は面白くなる！"
 ba_create_company_events.8.f: "何か面白いことない？黒崎コユキ、参上！やははは！"
 ba_create_company_events.9.t: "セミナーのリオ"
 ba_create_company_events.9.d: "光の届かない場所で再会しましょう。"
 ba_create_company_events.9.f: "ミレニアムサイエンススクール、セミナーの調月リオです。あらゆる問題に対して最も合理的なアプローチを提供します。"
 ba_create_company_events.10.t: "ティーパーティーのセリア"
 ba_create_company_events.10.d: "このように、すべての道は一つに繋がる"
 ba_create_company_events.10.f: "久しぶりですね。お待ちしておりました、先生。"
 ba_create_company_events.11.t: "ティーパーティーのミカ"
 ba_create_company_events.11.d: "お待たせ！私の出番よ！☆"
 ba_create_company_events.11.f: "心配しないで、聖園ミカがついに到着したわ！あら、もう先生とは親しい間柄だから、堅苦しい挨拶は省きましょうか？よろしくお願いします、先生。"
 ba_create_company_events.12.t: "対策委員会のシロコ"
 ba_create_company_events.12.d: "私の助けが必要ですか？"
 ba_create_company_events.12.f: "アビドス対策委員会、2年生の砂狼シロコです。よろしくお願いします。"
 ba_create_company_events.13.t: "対策委員会のセリカ"
 ba_create_company_events.13.d: "もうバイトに行かないと…いや、まだ時間がある。"
 ba_create_company_events.13.f: "黒見セリカです。私の前で手を抜くようなことは許しません。わかった？"
 ba_create_company_events.14.t: "対策委員会のノノミ"
 ba_create_company_events.14.d: "ついに私の出番が来た！"
 ba_create_company_events.14.f: "やったー、ついに来ました！よろしくお願いします、先生！"
 ba_create_company_events.15.t: "対策委員会のアヤネ"
 ba_create_company_events.15.d: "どうやって動くの？"
 ba_create_company_events.15.f: "奥空アヤネです。サポートさせていただきます。"
 ba_create_company_events.16.t: "RABBIT小隊のサキ"
 ba_create_company_events.16.d: "コールサイン、RABBIT 2。感度良好。"
 ba_create_company_events.16.f: "SRT学園、RABBIT小隊の空井サキです。それで、シャーレの作戦マニュアルはどこですか？"
 ba_create_company_events.17.t: "RABBIT小隊のミユ"
 ba_create_company_events.17.d: "こ、これはRABBIT 4。呼、呼ばれましたか…？"
 ba_create_company_events.17.f: "こ、これはSRT学園。RABBIT小隊の霞沢ミユです…。あの…帰、帰ってもいいですか…？"
 ba_create_company_events.18.t: "RABBIT小隊のモエ"
 ba_create_company_events.18.d: "こちらRABBIT 3。次の爆撃地点はどこ？"
 ba_create_company_events.18.f: "SRT学園、RABBIT小隊の風倉モエです。ひひひ…サポートさせていただきます。"