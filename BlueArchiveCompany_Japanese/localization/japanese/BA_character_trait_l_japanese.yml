l_japanese:
 #traits
 BA_Yuuka_ID: "優香の学生証"
 BA_Yuuka_ID_desc: "ミレニアムサイエンススクールの生徒会、セミナーの会計担当。\N優香は、STEM系学生の比率が高いミレニアムでも注目すべき数学的才能を持っています。ミレニアムの予算全体を管理しています。彼女の特技はそろばんで、感情や精神的な葛藤に直面した時に玉をいじる癖があります。"
 BA_Momoi_ID: "モモイの学生証"
 BA_Momoi_ID_desc: "ミレニアムスクールのゲーム開発部のシナリオライター。\Nモモイと双子の妹のミドリは、ゲーム開発部でゲームを開発しています。明るく陽気な性格が以前は内向的な妹と対立していましたが、ビデオゲームへの共通の愛により、今では二人は切っても切れない関係です。"
 BA_Hina_ID: "ヒナの学生証"
 BA_Hina_ID_desc: "ゲヘナ学園風紀委員会の委員長。\Nやや冷淡で、ほとんどすべてを面倒なことと考えるが、規則や規制に関しては風紀委員会の委員長としての役割を果たしています。"
 BA_Mari_ID: "マリーの学生証"
 BA_Mari_ID_desc: "シスターフッドに所属する誠実で慈悲深い少女。\Nいつもトリニティの生徒たちに親しみやすい笑顔で挨拶します。可愛らしさにもかかわらず、彼女の落ち着いた雰囲気のため、多くの人が相談に来ます。自己批判的で、常に自分が不足していると考えていますが、先輩たちのような偉大なシスターになることを夢見ています。"
 BA_Hikari_ID: "ヒカリの学生証"
 BA_Hikari_ID_desc: "ハイランダー鉄道学園CCCの職員。\N双子の妹ノゾミと共に、機関車運転技術の天才的才能により選ばれましたが、書類や管理業務では完全に失敗しています。他人の意見をほとんど気にせず、自分の欲望に従い、自分のペースで物事を行う傾向があり、様々なトラブルを引き起こします。"
 BA_Miyako_ID: "ミヤコの学生証"
 BA_Miyako_ID_desc: "SRT学園のRABBIT小隊のリーダー。コールサインは「RABBIT 1」。\Nミヤコは正義への深い憧れからSRT学園に入学しました。学園が突然閉鎖された時、彼女は家を失い、他のRABBIT小隊メンバーと共に公園でキャンプをしていました。率直で、考えていることをめったに示さないため無関心に見えることもありますが、小隊で最も優しい心を持っています。"
 BA_Mimori_ID: "ミモリの学生証"
 BA_Mimori_ID_desc: "百鬼夜行学園内規律部の優しい副部長。\N常に優しい笑顔で誰にでも親切なため、人気のある少女です。内規律部の部長であるツバキの幼馴染です。幼い頃に読んだ少女漫画のような優雅な女性になるという夢を叶えるために部に入部しました。料理や掃除をして夢を実現するために努力を続けています。"
 BA_Hare_ID: "ハレの学生証"
 BA_Hare_ID_desc: "ミレニアムサイエンススクールのハッカーグループ、ヴェリタスのエンジニア。\Nミレニアムの優秀な頭脳の中でも前例のない天才です。学園の最先端技術のほとんどは彼女によって開発されました。これらすべての業績にもかかわらず、彼女は謙虚で、親しみやすく、仲間に対して思いやりがあります。"
 BA_Fuuka_ID: "フウカの学生証"
 BA_Fuuka_ID_desc: "ゲヘナ学園の食堂を管理する給食部のメンバー。\N親切で真面目な学生で、ゲヘナでは珍しい存在です。毎朝、ゲヘナの生徒たちのために数百食の食事を準備し、提供しています。料理は上手ですが、食堂の人材不足によりその技術が軽視されています。それでも、彼女は諦めず、常にメニューを改善する方法を探しています。"
 BA_Nagisa_ID: "ナギサの学生証"
 BA_Nagisa_ID_desc: "トリニティ総合学園を構成する連合派閥の一つ、フィリウスのリーダーであり、ティーパーティーの主催者。\N甘く親しみやすい態度を持っていますが、本心をめったに明かさないため、あまり近づきにくいです。趣味はティーパーティーのためのお茶とお茶菓子の準備です。多くのトリニティの生徒が彼女の集まりに参加することを切望しています。"
 BA_Hifumi_ID: "ヒフミの学生証"
 BA_Hifumi_ID_desc: "トリニティ補習授業部の友好的で外向的なメンバー。\Nヒフミは平均的な成績の普通の少女ですが、それでもバランスの取れた性格で人気があり、好かれています。悩みや問題を打ち明けたい人の良い聞き手ですが、これにより流されてしまい、意図せずトラブルを引き起こすこともあります。"
 BA_Wakamo_ID: "ワカモの学生証"
 BA_Wakamo_ID_desc: "連邦百鬼夜行学園から停学処分を受けた後、矯正局から脱走した七囚人の一人。\N破壊的な行動により、災いの狐として恐れられています。彼女の動機は謎であり、マスクの下の顔についてもいくつかの噂があります。怪物のような悪魔が潜んでいるという人もいますが、それは単なる噂に過ぎません。"
 BA_Hoshino_ID: "ホシノの学生証"
 BA_Hoshino_ID_desc: "アビドス生徒会の副会長であり、対策委員会の会長。\N疲れた年寄りのように振る舞い、実際の仕事よりもいたずらを好みます。これはしばしば他の対策委員会メンバーとトラブルを引き起こしますが、任務中は、友達を守るために誰よりも前線で激しく戦います。"
 BA_Kisaki_ID: "キサキの学生証"
 BA_Kisaki_ID_desc: "山海経学園で起こるすべてのことを監督する生徒会、玄龍門の会長。\N優雅でありながら威圧的な話し方と神秘的な印象が混ざり合い、近づきにくい雰囲気を放っています。しかし、実際にはその印象を職務に役立てているようです。ほとんどの人に気づかれない「変装潜入旅行」は、それを知っている人にとってはかなりの光景になることがあります。"
 BA_Aru_ID: "アルの学生証"
 BA_Aru_ID_desc: "便利屋68の自称ボス。\Nアルは違法な事業活動を行うために、ゲヘナ学園の便利屋68クラブを無断で拡大しました。彼女は大胆で洗練された悪役として見られることを目指していますが、頻繁な失敗により、常に偽物として露呈してしまいます。"
 BA_Iroha_ID: "イロハの学生証"
 BA_Iroha_ID_desc: "万魔殿のメンバー。\Nイロハが最も嫌うのは邪魔されることです。彼女は多くの時間を、どうやって会社から逃げるかを考えることに費やしています。人々に一人にしてもらうために常に本を持ち歩いていますが、万魔殿（正確にはマコト）は常に彼女を邪魔します。彼女は不本意ながら万魔殿の幹部として仕えており、マスコットのイブキにだけ慰めを見出しています。"
 BA_Serina_ID: "セリナの学生証"
 BA_Serina_ID_desc: "トリニティ救護騎士団に所属する心優しい少女。\N慈善活動を楽しむ有徳の人で、周囲の人々の健康への関心により、母親のような存在としての評判を得ています。やや臆病な性格で、口論や衝突を避けますが、平和を脅かす敵に対して立ち上がる準備が常にできています。"
#  BA__ID: "の学生証"
#  BA__ID_desc: ""
#
 BA_Arisu_ID: "アリスの学生証"
 BA_Arisu_ID_desc: "ミレニアムスクールのゲーム開発部のメンバー。\N遺跡の中で眠っているところを発見された謎の少女。アリスの年齢や出身に関するすべての情報は不明です。現在、ミドリとモモイのおかげでハードコアなビデオゲームマニアになっています。彼女の不明瞭な発話の大部分は、レトロゲームの台詞で構成されています。"
 BA_Yuzu_ID: "ユズの学生証"
 BA_Yuzu_ID_desc: "ミレニアムのゲーム開発部の部長。\Nユズは社交不安に苦しみ、人と接することが困難なため、ゲーム開発部のキャビネットの中でほとんどの時間を過ごしています。それにもかかわらず、ゲームへの情熱は誰にも負けません。ゲームを作ることと遊ぶことの両方を愛しています。"
 BA_Midori_ID: "ミドリの学生証"
 BA_Midori_ID_desc: "ミレニアムスクールのゲーム開発部のイラストレーター。\Nミドリと双子の姉のモモイは、ゲーム開発部でゲームを開発しています。\N内向的な性格が以前は社交的な姉と対立していましたが、ビデオゲームへの共通の愛により、今では二人は切っても切れない関係です。"
 BA_Azusa_ID: "アズサの学生証"
 BA_Azusa_ID_desc: "トリニティ補習授業部の氷の女王。\N学校を中退した後、トリニティに来て再び勉強しています。孤独にもかかわらず、アズサはトラブルを避けるために他人から距離を置いています。これは他の補習授業部メンバーの懸念の源となっています。"
 BA_Koharu_ID: "コハルの学生証"
 BA_Koharu_ID_desc: "トリニティ補習授業部のメンバー。\Nコハルはもともと正義実現委員会の一員でしたが、成績不良により落第のリスクがあり、補習授業部への転部を余儀なくされました。エリート学生だと思っているにもかかわらず、授業についていけない愚か者です。コハルは楽しみのためにエッチな本を読み、些細なことから下品な考えを抱き、最終的に自分を恥ずかしい思いにさせます。"
 BA_Hanako_ID: "ハナコの学生証"
 BA_Hanako_ID_desc: "補習授業部の友好的な少女。\N一見すると静かで優雅な若い女性のように見えるかもしれませんが、ハナコが口を開くたびに不適切で下品なコメントが次々と出てきます。補習授業部のすべてのメンバーは、ハナコが話し始めるたびに緊張します。"
 BA_Noa_ID: "ノアの学生証"
 BA_Noa_ID_desc: "ミレニアムスクール生徒会、セミナーの書記。\N主な責任はセミナーの公式記録を維持することですが、ミレニアムの学生創作の特許出願や製品評価の監督など、様々な法的・管理的業務も担当しています。彼女の並外れた記憶力により、一度読んだり聞いたりしたことはほぼ完璧に覚えることができます。"
 BA_Koyuki_ID: "コユキの学生証"
 BA_Koyuki_ID_desc: "ミレニアムのセミナーの優秀だが厄介なメンバー。\N彼女は数学的解読における比類なき才能に全く気づいていません。常に運を試そうとします。行き過ぎて困難な状況に陥っても、決して止まりません。"
 BA_Rio_ID: "リオの学生証"
 BA_Rio_ID_desc: "ミレニアムスクールの生徒会、セミナーの会長。\Nミレニアムと世界の平和への願望が、彼女を必要だと思うことを何でもするように駆り立てます。その結果、彼女は皆の「お姉さん」として知られるようになりました。彼女のスタイルと美的趣味は非常に独特です。少数の学生にしか知られていないアバンギャルドロボット部隊は、その趣味を体現しています。"
 BA_Seia_ID: "セリアの学生証"
 BA_Seia_ID_desc: "トリニティ総合学園のティーパーティーのメンバーであり、サンクトゥスのリーダー。\N他の人々は彼女を説教臭く予測不可能だと考えています。気まぐれで衝動的で、貴族のようなところがあります。暗殺未遂からの回復後、彼女は頑固で子供っぽい面をより多く見せています。"
 BA_Mika_ID: "ミカの学生証"
 BA_Mika_ID_desc: "トリニティ総合学園を構成する連合派閥の一つ、パテルの元リーダー。\N元ティーパーティーメンバーで、ティーパーティーの別のメンバーであるナギサの幼馴染です。二人が政治的に対立する時、彼女は公の意見の相違と私的な友情の間に明確な線を引きます。\N活気があり陽気に見え、常に笑顔を絶やしません。しかし、彼女の態度は明かせない心配事を隠しており、彼女をある種の謎にしています。"
 BA_Serika_ID: "セリカの学生証"
 BA_Serika_ID_desc: "アビドス対策委員会の良心的な会計担当。\Nセリカはよく文句を言い、意見を述べることを躊躇しません。学園を「この学園なんてクソくらえ！」と罵る習慣にもかかわらず、密かに学園に非常に献身的で、学園の借金を返済しようとアルバイトまでしています。"
 BA_Shiroko_ID: "シロコの学生証"
 BA_Shiroko_ID_desc: "アビドス対策委員会のスポーティーなフィールドキャプテン。\N言葉少なく、ほとんど表情のない少女で、シロコは冷淡で感情がない印象を与えます。実際には、彼女は何よりもアビドス高校に献身的です。学園の復興のためなら、何でもする覚悟があり、時には自分で風変わりなアイデアを提案することもあります。"
 BA_Nonomi_ID: "ノノミの学生証"
 BA_Nonomi_ID_desc: "アビドス対策委員会のメンバー。\N友好的で快活な少女で、対策委員会に他のメンバーの極端な性格をバランスさせるために必要な感情的なサポートを提供します。表には出しませんが、裕福な家庭の出身で、対策委員会のおやつのほとんどを自分のポケットマネーで支払っています。"
 BA_Ayane_ID: "アヤネの学生証"
 BA_Ayane_ID_desc: "アビドス対策委員会の勤勉な書記。\N規則や規制に厳格な働き者で、アビドス高校の復興に貢献するために最善を尽くしています。"
 BA_Saki_ID: "サキの学生証"
 BA_Saki_ID_desc: "SRT学園RABBIT小隊のポイントウーマン。コールサインは「RABBIT 2」。\Nサキは常に夢見ていた規律ある生活を送るためにSRT学園に入学しました。学園が閉鎖された時、彼女は小隊と共に学校を諦めることを拒否し、公園でキャンプをして抗議を始めました。優等生で、今でも教科書とSRTマニュアルを持ち歩いています。野生の野菜や物資として再利用できるゴミを採集することを楽しんでいます。"
 BA_Miyu_ID: "ミユの学生証"
 BA_Miyu_ID_desc: "SRT学園のRABBIT小隊の狙撃手。コールサインは「RABBIT 4」。\Nミユは自然な狙撃の才能によりSRTに入りましたが、控えめで内気な気質に苦しみました。学園に居場所を見つけたばかりの時、学園が閉鎖され、小隊の他のメンバーと共に公園でキャンプを始めました。存在感のなさは優れた狙撃手にしていますが、時には味方でさえ彼女の存在を忘れることがあります。"
 BA_Moe_ID: "モエの学生証"
 BA_Moe_ID_desc: "SRT学園RABBIT小隊のオペレーター。コールサインはRABBIT 3。\N彼女は大規模な火力に憧れてSRT学園に入りましたが、学園は突然閉鎖されました。現在は小隊メンバーと共に公園で生活しています。物を爆破したり破壊したりすることを楽しむという奇妙な点がありますが、オペレーターとしての能力は非常に印象的です。砂糖に中毒しており、常に口にロリポップを咥えています。"
